name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    # The build integrations touch the file system directly, so they are exercised
    # on Windows and macOS too — path separators, case sensitivity and atomic
    # renames all differ there.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: windows-latest
            node: 20
          - os: macos-latest
            node: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Before the tests, not after: `test/integration/plugin-shape.test.ts` asserts on
      # `dist/` and skips itself when there is none, so running the suite first left the
      # one check guarding the string-named PostCSS entry green *by never running*.
      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:coverage

  package:
    # Lint and the packaging checks are platform-independent, so run them once.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate package (publint)
        run: npm run check:publish

      - name: Validate types (are-the-types-wrong)
        run: npm run check:exports

  engines:
    # `engines` claims Node >= 18, but the test runner itself needs 20+. Build on a
    # supported Node, then load the published artifact on the oldest one we promise,
    # so the claim is verified rather than asserted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Import the built package on the oldest supported Node
        run: |
          node --input-type=module -e "
            import assert from 'node:assert/strict';
            const { cn, ss, on } = await import('./dist/index.js');
            const { createRequire } = await import('node:module');
            const require = createRequire(process.cwd() + '/x.js');

            assert.equal(cn('px-2', 'px-4'), 'px-4');
            assert.equal(ss({ base: 'flex', md: 'grid', hover: 'underline' }), 'flex md:grid hover:underline');
            assert.equal(on(['dark', 'hover'], 'bg-black'), 'dark:hover:bg-black');

            assert.equal(require('./dist/index.cjs').cn('p-2', 'p-4'), 'p-4');
            assert.equal(typeof (await import('./dist/vite/index.js')).default, 'function');
            assert.equal(typeof require('./dist/postcss/index.cjs'), 'function');
            console.log('ok on ' + process.version);
          "

  example:
    # The only place a real Vite build runs. Everything else calls the plugin's hooks
    # directly, which cannot catch a plugin that is shaped wrong for the host — and the
    # gate itself is never dogfooded anywhere else either.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # `file:../..` links the package itself, so this is the built artifact a consumer
      # would install rather than a copy of `src/`.
      - name: Install the example
        run: npm install --no-audit --no-fund
        working-directory: examples/vite-react

      - name: Typecheck the example
        run: npx tsc -p tsconfig.json
        working-directory: examples/vite-react

      - name: Build the example
        run: npm run build
        working-directory: examples/vite-react

      - name: Gate the example
        run: npx tailess check --content src --strict
        working-directory: examples/vite-react

      # The negative: with the plugin removed the build still succeeds and the page
      # renders the right class attributes with no styles behind them, so the gate has
      # to be what goes red. A green run here would mean the gate proves nothing.
      - name: The gate must fail when the plugin is not wired up
        working-directory: examples/vite-react
        run: |
          sed -i 's/, tailess({ diagnostics: "error" })//' vite.config.ts
          if npx tailess check --content src --strict; then
            echo "::error::the gate passed a project with the plugin removed"
            exit 1
          fi
          echo "the gate failed, as it must"
