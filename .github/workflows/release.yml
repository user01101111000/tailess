name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm provenance

jobs:
  # The matrix that motivates the re-verification below, run *before* the publish rather
  # than beside it. An npm version cannot be unpublished, and CI's own comment names the
  # three things no unit test reaches: the platforms the filesystem integrations differ
  # on, the `engines` floor loaded for real, and a plugin shaped wrong for its host. The
  # release job used to re-run a strict subset of that concurrently with CI, so a Windows
  # regression, a broken `tailess/postcss` string resolution for Next, or a failure on the
  # oldest supported Node could all be published minutes before the run that found them
  # went red.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      # Both pinned to a commit, like the publish step below and for its reason: this job
      # holds `id-token: write`, `contents: write` and the npm token, and a moved tag runs
      # whatever it points at inside it. setup-node's post step even runs after the publish.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 22, not 20: `@changesets/cli` v3 declares `node: "^22.11 || ^24 || >=26"` and its
      # `bin.js` calls `module.enableCompileCache()`, which Node 20 does not have — so the
      # publish step died with `TypeError: enableCompileCache is not a function` before it
      # could do anything. This is the *development* floor moving, not the package's:
      # `engines` still promises consumers Node >= 20.19, and the CI matrix still proves it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # `--engine-strict` here and nowhere else. npm only *warns* when a dependency's
      # `engines` are not satisfied, which is how a devDependency raising its Node floor
      # stayed invisible until the one job that runs it — the release — reached the step
      # that cannot be retried by rerunning a green CI. Failing the install instead makes
      # the next one of these loud, and early.
      #
      # `--ignore-scripts` because nothing in this tree needs an install script to build —
      # the output is byte-identical without them — and every one is code a dependency
      # runs in the job that can publish. esbuild finds its platform binary through its
      # optional dependency either way.
      - name: Install dependencies
        run: npm ci --engine-strict --ignore-scripts

      # `needs: ci` above is the verification now — the whole matrix, on the same
      # commit, finished before this job starts. What is left here is the build the
      # publish itself needs, and running it here means a build failure stops the job
      # before the publish step starts. That step still runs `prepublishOnly` — the build
      # and both package checks — with the npm token in its environment, so the toolchain
      # is inside the token's reach there; building and packing in a job with no secrets,
      # then publishing the tarball, is what would take it out.
      - name: Build
        run: npm run build

      # Pinned to a commit, not the moving `v2` tag: this step runs with `id-token:
      # write` and the npm token in its environment, so whoever can move that tag can
      # publish as this package. Bump it deliberately, the way a dependency is bumped —
      # and read its inputs when you do. Every one of these was renamed in v2
      # (`publish` -> `publish-script`, `version` -> `version-script`, `commit` ->
      # `commit-message`, `title` -> `pr-title`), and an input a GitHub action does not
      # declare is a warning rather than an error, so the step kept running with no
      # publish script at all and failed further in.
      - name: Create release PR or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: npm run release
          version-script: npm run changeset -- version
          commit-message: "chore: release"
          pr-title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
