name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # CI runs on this same push, but nothing makes the release job wait for it,
      # so re-verify here. Otherwise a regression can publish while CI is still red,
      # and an npm version cannot be unpublished once it is out.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Built before the tests, so the suite that asserts on `dist/` actually runs —
      # see the note in ci.yml.
      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      # Pinned to a commit, not the moving `v1` tag: this step runs with `id-token:
      # write` and the npm token in its environment, so whoever can move that tag can
      # publish as this package. Bump it deliberately, the way a dependency is bumped.
      - name: Create release PR or publish to npm
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: npm run release
          version: npm run changeset -- version
          commit: "chore: release"
          title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
