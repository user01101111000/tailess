name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm provenance

jobs:
  # The matrix that motivates the re-verification below, run *before* the publish rather
  # than beside it. An npm version cannot be unpublished, and CI's own comment names the
  # three things no unit test reaches: the platforms the filesystem integrations differ
  # on, the `engines` floor loaded for real, and a plugin shaped wrong for its host. The
  # release job used to re-run a strict subset of that concurrently with CI, so a Windows
  # regression, a broken `tailess/postcss` string resolution for Next, or a failure on the
  # oldest supported Node could all be published minutes before the run that found them
  # went red.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # `needs: ci` above is the verification now — the whole matrix, on the same
      # commit, finished before this job starts. What is left here is the build the
      # publish itself needs: `prepublishOnly` runs it again, and running it once here
      # means a build failure stops the job before the npm token is ever in scope.
      - name: Build
        run: npm run build

      # Pinned to a commit, not the moving `v2` tag: this step runs with `id-token:
      # write` and the npm token in its environment, so whoever can move that tag can
      # publish as this package. Bump it deliberately, the way a dependency is bumped —
      # and read its inputs when you do. Every one of these was renamed in v2
      # (`publish` -> `publish-script`, `version` -> `version-script`, `commit` ->
      # `commit-message`, `title` -> `pr-title`), and an input a GitHub action does not
      # declare is a warning rather than an error, so the step kept running with no
      # publish script at all and failed further in.
      - name: Create release PR or publish to npm
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          publish-script: npm run release
          version-script: npm run changeset -- version
          commit-message: "chore: release"
          pr-title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
